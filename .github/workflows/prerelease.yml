# this file will build the app, create a downloadable artifact, publish the app to OpenStore and create a release with the build app as asset

name: build and github release

on:
  # start the script when a tag is pushed ending with RC (no underline before RC, that will fail linting)
  # tag format: v1.2.3.4RC
  # note: GitHub Actions does not support full regex in tag patterns; it uses simple glob patterns like *, ?, and [] instead.
  # https://docs.github.com/en/actions/writing-workflows/workflow-syntax-for-github-actions#filter-pattern-cheat-sheet
  push:
    tags:
      - 'v*.*.*.*RC'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# this file will build the app, create a downloadable artifact, publish the app to OpenStore and create a release with the build app as asset
name: Clickable build, publish and release

on:
  # start the script when a tag is pushed
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# define the build job
jobs:
  build:
    strategy:
    # defining some matrix variables for later usage
      matrix:
        arch: [all] # can also be if needed [amd64, arm64, armhf]
        appname: [activitytracker.cwayne18]
    runs-on: ubuntu-24.04 # ubuntu-latest -> this targets 26.04 from 19th of November 26
    # defining all build steps that should be executed
    steps:
      - name: Checkout
        uses: actions/checkout@v7 # here @latest doesn't work, specific version v4 or above, https://github.com/actions/checkout/releases
      - name: Parse version
        # extract the version number from manifest.json.in
        # find the line with the version, split at " and take the 4th value
        run: |
          echo ARTIFACT_VERSION=$(cat manifest.json.in | grep "\"version\": "  | awk -F'"' '$0=$4') >> $GITHUB_ENV
      - name: Install clickable
        # use python to install clickable so clickable commands can be used
        run: |
          python3 -m pip install clickable-ut
      - name: Build
        # build the app with clickable for all specified architectures
        run: |
          clickable build --arch ${{ matrix.arch }}
      - name: Upload Artifacts
        # upload the build artifacts to github using the appname and version
        uses: actions/upload-artifact@v7 # here @latest doesn't work, specific version v4 or above, see https://github.com/actions/upload-artifact/releases
        with:
          name: ${{ matrix.appname }}_${{ env.ARTIFACT_VERSION }}_${{ matrix.arch }}
          path: build/*/app/*.click
          if-no-files-found: error
      - name: Create Release
        # if a tag has been pushed, create a release with the last commit message (=changelog) as content
        id: create_release
        uses: softprops/action-gh-release@v3 # here @latest doesn't work, specific version v2 or above, see https://github.com/softprops/action-gh-release/releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # This token is provided by Actions, you do not need to create your own token
        with:
          tag_name: ${{ github.ref }}
          name: Release ${{ github.ref }}
          body: "${{ github.event.head_commit.message }}" # grab the last commit message as changelog
          draft: false
          prerelease: true
          files: ${{ matrix.appname }}_${{ env.ARTIFACT_VERSION }}_${{ matrix.arch }}
          fail_on_unmatched_files: false