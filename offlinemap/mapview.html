<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <link rel="stylesheet" href="maplibre/maplibre-gl.css" />
  <script src="maplibre/maplibre-gl.js"></script>
  <style>
    html, body, #map { height: 100%; margin: 0; padding: 0; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    // Startkoordinaten aus URL-Parametern lesen, mit sinnvollem Fallback
    var params = new URLSearchParams(window.location.search);
    var initialLat = parseFloat(params.get('lat'));
    var initialLon = parseFloat(params.get('lon'));
    var initialZoom = parseFloat(params.get('zoom'));

    var hasValidStart = !isNaN(initialLat) && !isNaN(initialLon);

    var map = new maplibregl.Map({
        container: 'map',
        style: 'http://localhost:8553/v1/mbgl/style?style=osmbright', //mc-car mc osmbright osmbright-car
        center: hasValidStart ? [initialLon, initialLat] : [0,0],
        zoom: 12//initialZoom// hasValidStart ? (isNaN(initialZoom) ? 12 : initialZoom) : 6
    });

    var trackReady = false;
    var pendingCoords = null;

    map.on('load', function () {
        map.addSource('track', {
            type: 'geojson',
            data: { type: 'Feature', geometry: { type: 'LineString', coordinates: [] } }
            });
            map.addLayer({
            id: 'track-line',
            type: 'line',
            source: 'track',
            paint: { 'line-color': '#ff0000', 'line-width': 4 }
        });

        // get center-marker position
        map.addSource('center-point', {
            type: 'geojson',
            data: {
                type: 'Feature',
                geometry: { type: 'Point', coordinates: map.getCenter().toArray() }
            }
        });

        // draw center marker
        map.addLayer({
            id: 'center-circle',
            type: 'circle',
            source: 'center-point',
            paint: {
                'circle-radius': 20,  // radius in pixel
                'circle-color': 'rgba(62, 179, 79, 0.4)', // fill color
                'circle-stroke-color': 'rgba(0, 0, 0, 0.4)', // outline
                'circle-stroke-width': 3
            }
        });

        trackReady = true;

        if (pendingCoords) {
            drawTrack(pendingCoords);
            pendingCoords = null;
        }

        increaseTextSize(2.25);
    });

    function drawTrack(coords) {
    var lineCoords = coords.map(function (c) { return [c[1], c[0]]; });
    map.getSource('track').setData({
        type: 'Feature',
        geometry: { type: 'LineString', coordinates: lineCoords }
    });
    if (lineCoords.length > 0) {
        var bounds = lineCoords.reduce(function (b, c) {
        return b.extend(c);
        }, new maplibregl.LngLatBounds(lineCoords[0], lineCoords[0]));
        map.fitBounds(bounds, { padding: 250 });
    }
    }

    function showTrack(coords) {
        if (trackReady) {
            drawTrack(coords);
        } else {
            pendingCoords = coords;
        }
    }

    var liveCoords = [];

    function initLiveTrack(lat, lon) {
        liveCoords = [[lon, lat]];
        if (trackReady) {
            map.getSource('track').setData({
                type: 'Feature',
                geometry: { type: 'LineString', coordinates: liveCoords }
            });
            map.setCenter([lon, lat]);
            map.setZoom(19); // adjust as needed
            if (map.getSource('center-point')) {
                map.getSource('center-point').setData({
                type: 'Feature',
                geometry: { type: 'Point', coordinates: [lon, lat] }
                });
            }
        }
    }

    function addTrackPoint(lat, lon) {
        liveCoords.push([lon, lat]);
        if (trackReady) {
            map.getSource('track').setData({
                type: 'Feature',
                geometry: { type: 'LineString', coordinates: liveCoords }
            });
        }
    }

    function centerOn(lat, lon) {
        map.setCenter([lon, lat]);
        if (map.getSource('center-point')) {
            map.getSource('center-point').setData({
                type: 'Feature',
                geometry: { type: 'Point', coordinates: [lon, lat] }
            });
        }
    }

    function increaseTextSize(factor) {
        var layers = map.getStyle().layers;
        for (var i = 0; i < layers.length; i++) {
            var layer = layers[i];
            if (layer.type !== 'symbol') continue;

            var currentSize = map.getLayoutProperty(layer.id, 'text-size');
            if (currentSize === undefined) continue; // Layer ohne Textbeschriftung

            var newSize;
            if (typeof currentSize === 'number') {
                // multiply with factor
                newSize = currentSize * factor;
            } else {
                // Ausdruck (z.B. zoom-abhängige "interpolate"-Funktion) -> mit "*" umwickeln
                newSize = ['*', currentSize, factor];
            }

            map.setLayoutProperty(layer.id, 'text-size', newSize);
        }
    }
  </script>
</body>
</html>
